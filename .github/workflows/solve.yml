name: AI Solve

# Fires when an issue is labeled `ai-solve` (the browser app does that).
# Spins up a fresh runner, runs the Claude Code agent against this repo,
# and opens a draft PR linked to the issue.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve:
    if: |
      (github.event_name == 'issues' &&
       github.event.label.name == 'ai-solve') ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/ai-solve') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    concurrency:
      group: ai-solve-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      - name: Announce start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.issue.number,
              body: `🤖 Solve started — see [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            });

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code agent
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-sonnet-4-6
          allowed_tools: "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh:*)"
          prompt: |
            You are resolving GitHub issue #${{ github.event.issue.number }} in
            ${{ github.repository }}.

            Steps:
            1. Read the issue: `gh issue view ${{ github.event.issue.number }}`.
            2. Diagnose the root cause in code. Post the diagnosis as an issue
               comment that STARTS WITH "## Diagnosis" so the browser app can
               surface it.
            3. If no code change is needed, post a comment starting with
               "## No fix needed" explaining why, then stop.
            4. Otherwise:
               - Configure git: `git config user.email "claude@users.noreply.github.com"` and `git config user.name "Claude"`.
               - Create branch: `ai/issue-${{ github.event.issue.number }}-$(date +%s | tail -c 7)`.
               - Apply the minimal fix using the Edit tool. Add or update a
                 doc comment on every touched function (JSDoc / docstring /
                 Go / Rust / Javadoc / Ruby # — match the language).
               - `git add -A && git commit -m "fix: <short summary>

                 Closes #${{ github.event.issue.number }}"`
               - `git push -u origin HEAD`
               - `gh pr create --draft --title "<title>" --body "Closes #${{ github.event.issue.number }}

                 <summary>"`
            5. Post a final comment starting with "## PR opened" containing
               the PR URL.

            Constraints:
            - Never force-push.
            - Never modify files under .github/workflows.
            - Never push directly to the default branch.
            - Keep edits minimal and on-topic.

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.addLabels({
              ...context.repo, issue_number, labels: ['ai-solve-failed']
            });
            await github.rest.issues.removeLabel({
              ...context.repo, issue_number, name: 'ai-solve'
            }).catch(() => {});
            await github.rest.issues.createComment({
              ...context.repo, issue_number,
              body: `❌ Solve failed — see [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            });
